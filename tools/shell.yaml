- id: ohmyposh
  name: Oh My Posh
  category: Shell
  description: Cross-platform prompt theme engine
  homepage: https://ohmyposh.dev
  install:
    winget: "JanDeDobbeleer.OhMyPosh"
    brew: "jandedobbeleer/oh-my-posh/oh-my-posh"
    script: "curl -s https://ohmyposh.dev/install.sh | bash -s"
  verify:
    - command: "oh-my-posh --version"
      regex: "([0-9]+(?:\\.[0-9]+)+)"

- id: zoxide
  name: zoxide
  category: Shell
  description: Smarter cd command
  install:
    winget: "ajeetdsouza.zoxide"
    brew: "zoxide"
    apt: "zoxide"
  verify:
    - command: "zoxide --version"
      regex: "zoxide ([0-9]+(?:\\.[0-9]+)+)"

