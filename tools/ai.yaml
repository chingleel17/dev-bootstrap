- id: codex
  name: OpenAI Codex CLI
  category: AI
  description: OpenAI coding agent CLI
  homepage: https://developers.openai.com/codex
  install:
    npm: "@openai/codex"
  verify:
    - command: "codex --version"
      regex: "([0-9]+(?:\\.[0-9]+)+)"

- id: claude
  name: Claude Code
  category: AI
  description: Anthropic coding agent CLI
  homepage: https://docs.anthropic.com/en/docs/claude-code
  install:
    powershell: "powershell -NoProfile -ExecutionPolicy Bypass -Command \"irm https://claude.ai/install.ps1 | iex\""
    script: "curl -fsSL https://claude.ai/install.sh | bash"
  update:
    command: "claude update"
    note: "原生安裝版會在背景自動更新，claude update 可立即手動更新。"
  verify:
    - command: "claude --version"
      regex: "([0-9]+(?:\\.[0-9]+)+)"

- id: opencode
  name: OpenCode CLI
  category: AI
  description: AI coding agent CLI
  homepage: https://opencode.ai
  install:
    npm: "opencode-ai"
  update:
    command: "opencode upgrade"
  verify:
    - command: "opencode --version"
      regex: "([0-9]+(?:\\.[0-9]+)+)"

- id: gemini
  name: Gemini CLI
  category: AI
  description: Google Gemini CLI
  homepage: https://github.com/google-gemini/gemini-cli
  install:
    npm: "@google/gemini-cli"
  verify:
    - command: "gemini --version"
      regex: "([0-9]+(?:\\.[0-9]+)+)"

- id: openspec
  name: OpenSpec
  category: AI
  description: Spec workflow CLI
  homepage: https://github.com/Fission-AI/OpenSpec
  install:
    npm: "@fission-ai/openspec"
  verify:
    - command: "openspec --version"
      regex: "([0-9]+(?:\\.[0-9]+)+)"
