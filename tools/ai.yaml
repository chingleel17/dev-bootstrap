- id: codex
  name: OpenAI Codex CLI
  category: AI
  description: OpenAI coding agent CLI
  homepage: https://developers.openai.com/codex
  install:
    npm: "@openai/codex"
  verify:
    - command: "codex --version"
      regex: "([0-9]+(?:\\.[0-9]+)+)"

- id: claude
  name: Claude Code
  category: AI
  description: Anthropic coding agent CLI
  homepage: https://docs.anthropic.com/en/docs/claude-code
  install:
    powershell: "powershell -NoProfile -ExecutionPolicy Bypass -Command \"irm https://claude.ai/install.ps1 | iex\""
    script: "curl -fsSL https://claude.ai/install.sh | bash"
  update:
    command: "claude update"
    note: "原生安裝版會在背景自動更新，claude update 可立即手動更新。"
  verify:
    - command: "claude --version"
      regex: "([0-9]+(?:\\.[0-9]+)+)"

- id: opencode
  name: OpenCode CLI
  category: AI
  description: AI coding agent CLI
  homepage: https://opencode.ai
  install:
    bun: "opencode-ai"
  update:
    command: "opencode upgrade"
  verify:
    - command: "opencode --version"
      regex: "([0-9]+(?:\\.[0-9]+)+)"

- id: gemini
  name: Gemini CLI
  category: AI
  description: Google Gemini CLI
  homepage: https://github.com/google-gemini/gemini-cli
  install:
    npm: "@google/gemini-cli"
  verify:
    - command: "gemini --version"
      regex: "([0-9]+(?:\\.[0-9]+)+)"

- id: openspec
  name: OpenSpec
  category: AI
  description: Spec workflow CLI
  homepage: https://github.com/Fission-AI/OpenSpec
  install:
    npm: "@fission-ai/openspec"
  verify:
    - command: "openspec --version"
      regex: "([0-9]+(?:\\.[0-9]+)+)"

- id: herdr
  name: Herdr
  category: AI
  description: AI coding agent terminal workspace manager
  homepage: https://herdr.dev
  install:
    powershell: "powershell -NoProfile -ExecutionPolicy Bypass -Command \"irm https://herdr.dev/install.ps1 | iex\""
    script: "curl -fsSL https://herdr.dev/install.sh | sh"
  update:
    command: "herdr update"
    note: "從設定的發布頻道下載並安裝最新版。"
  verify:
    - command: "herdr --version"
      regex: "([0-9]+(?:\\.[0-9]+)+)"

- id: agent-browser
  name: agent-browser
  category: AI Tools
  description: Browser automation CLI for AI agents
  homepage: https://agent-browser.dev
  install:
    brew: "agent-browser"
    npm: "agent-browser"
  postInstall: "agent-browser install"
  update:
    command: "agent-browser upgrade"
  verify:
    - command: "agent-browser --version"
      regex: "([0-9]+(?:\\.[0-9]+)+)"

- id: playwright-cli
  name: Playwright CLI
  category: AI Tools
  description: Playwright browser CLI and skills for AI agents
  homepage: https://playwright.dev/docs/getting-started-cli
  install:
    npm: "@playwright/cli"
  postInstall: "playwright-cli install --skills -g"
  update:
    command: "npm install -g @playwright/cli@latest && playwright-cli install --skills -g"
    note: "更新 CLI 後同步更新 skills，避免版本不一致。"
  verify:
    - command: "playwright-cli --version"
      regex: "([0-9]+(?:\\.[0-9]+)+)"
